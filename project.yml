name: TextSnap

options:
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  knownRegions:
    - en
    - Base
    - zh-Hans
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: SHZQ3MWP3B
    COMBINE_HIDPI_IMAGES: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_HARDENED_RUNTIME: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ENABLE_TESTABILITY: YES
    Release:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      ENABLE_HARDENED_RUNTIME: YES
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig

packages:
  MacKit:
    url: https://github.com/x0c/mac-kit-swift
    from: "0.1.4"

fileGroups:
  - Configuration
  - AGENTS.md
  - CLAUDE.md
  - docs
  - design

targets:
  TextSnap:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: TextSnap
        excludes:
          - AppIcon.icon
          - "AppIcon.icon/**"
    resources:
      - path: TextSnap/AppIcon.icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.caozc.TextSnap
        PRODUCT_MODULE_NAME: TextSnap
        PRODUCT_NAME: TextSnap
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: TextSnap/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: TextSnap
        INFOPLIST_KEY_CFBundleName: TextSnap
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026. All rights reserved."
        INFOPLIST_KEY_NSMainStoryboardFile: ""
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: "TextSnap 需要录制屏幕来框选你指定的区域并识别其中的文字。TextSnap needs screen recording to capture the region you select and recognize its text."
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/../Frameworks"
    dependencies:
      - package: MacKit
        product: MacKitCore
      - package: MacKit
        product: MacKitLaunchAtLogin
      - package: MacKit
        product: MacKitLifecycle
      - package: MacKit
        product: MacKitStatusItem

  TextSnapTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - TextSnapTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.caozc.TextSnap.tests
        PRODUCT_NAME: TextSnapTests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TextSnap.app/Contents/MacOS/TextSnap
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: TextSnap

schemes:
  TextSnap:
    build:
      targets:
        TextSnap: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: TextSnapTests
    analyze:
      config: Debug
    archive:
      config: Release
